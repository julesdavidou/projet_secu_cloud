name: CaribouTV

services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
    command: mosquitto -c /mosquitto-no-auth.conf

  serveur-zone:
    build: ./serveur-zone
    container_name: serveur-zone-zone-a
    ports:
      - "8000:8000"
    env_file:
      - ./serveur-zone/.env
    depends_on:
      - mqtt-broker
    volumes:
      - serveur-zone-db:/data

volumes:
  mosquitto-data:
  serveur-zone-db:
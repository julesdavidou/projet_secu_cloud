name: CI

on:
  push:

  pull_request:


permissions:
  contents: read


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:

  go:
    name: Go checks

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7


      - name: Setup Go
        uses: actions/setup-go@v7

        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum


      - name: Check formatting
        run: |
          files="$(gofmt -l .)"

          if [ -n "$files" ]; then
            echo "Unformatted files:"
            echo "$files"
            exit 1
          fi


      - name: Go vet
        run: go vet ./...


      - name: Tests
        run: go test -race ./...


      - name: Build
        run: go build ./cmd/edge-agent


  docker:
    name: Docker multi-architecture

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7


      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4


      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4


      - name: Build AMD64 and ARM64
        uses: docker/build-push-action@v7

        with:
          context: .
          file: ./Dockerfile.edge-agent

          platforms: linux/amd64,linux/arm64

          push: false

          tags: projet-secu-cloud/edge-agent:ci

          cache-from: type=gha
          cache-to: type=gha,mode=max


  integration:
    name: Docker Compose integration without MQTT

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7


      - name: Create environment
        run: cp .env.example .env


      - name: Validate Compose
        run: docker compose config --quiet


      - name: Start services
        run: docker compose up -d --build


      - name: Wait for Edge Agent
        run: |
          for i in {1..30}; do

            if curl \
              --fail \
              --silent \
              http://localhost:8080/health
            then
              exit 0
            fi

            sleep 2

          done

          echo "Edge Agent did not start"
          exit 1


      - name: Logs
        if: always()
        run: docker compose logs


      - name: Cleanup
        if: always()
        run: docker compose down -v
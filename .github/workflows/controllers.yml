name: Deployable controllers
on:
  push:
    paths: ['cmd/**', 'internal/**', 'pkg/controllers/**', 'pkg/placement/**', 'serveur-zone/**', 'lab/placement/**', 'deploy/lab/**', 'go.mod', 'go.sum', '.github/workflows/controllers.yml']
  pull_request:
    paths: ['cmd/**', 'internal/**', 'pkg/controllers/**', 'pkg/placement/**', 'serveur-zone/**', 'lab/placement/**', 'deploy/lab/**', 'go.mod', 'go.sum', '.github/workflows/controllers.yml']
permissions:
  contents: read
jobs:
  controllers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Independent tests, race and vet in three modules
        run: docker build -f deploy/lab/Dockerfile --target verify .
      - name: Provision and run actual storage smoke
        shell: pwsh
        run: |
          ./deploy/lab/init.ps1
          ./deploy/lab/start.ps1 -SkipInit
          ./deploy/lab/smoke.ps1
      - name: Diagnostic logs
        if: always()
        run: docker compose -f deploy/lab/compose.yaml --profile local --profile real-http logs --tail 100 --no-color
      - name: Cleanup only this test project
        if: always()
        run: docker compose -f deploy/lab/compose.yaml --profile local --profile real-http down -v

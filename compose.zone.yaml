# Additive integration of containers, without replacing main's Edge Compose.
name: cariboutv-zone-reference
services:
  serveur-zone:
    build:
      context: .
      dockerfile: serveur-zone/Dockerfile
    environment:
      APP_PORT: '8000'
      PLACEMENT_ENABLED: '0'
      LEGACY_COMMANDS_ENABLED: '0'
    ports: ['127.0.0.1:8000:8000']
    volumes: [serveur-zone-db:/data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  serveur-zone-db:

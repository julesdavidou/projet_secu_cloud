name: caribou-integration
x-common: &common
  image: caribou/integration-control:dev
  restart: unless-stopped
  init: true
  cpus: 1.0
  mem_limit: 256m
  networks: [control]
  environment: &env
    CONTROLLERS_CONFIG: /config/config.json
    SECRETS_DIR: /run/lab-secrets
    MQTT_BROKER: mqtt://broker:1883
  depends_on:
    broker: {condition: service_healthy}
services:
  broker:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
    ports: ["${LAB_BIND_IP:-127.0.0.1}:${MQTT_PORT:-1884}:1883"]
    volumes:
      - ../lab/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../lab/config/broker-entrypoint.sh:/entrypoint.sh:ro
      - ./.runtime/broker:/provision:ro
      - broker-data:/mosquitto/data
    entrypoint: [/bin/sh, /entrypoint.sh]
    healthcheck:
      test: [CMD-SHELL, 'nc -z 127.0.0.1 1883']
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [control]
  central:
    <<: *common
    build: {context: ../.., dockerfile: deploy/lab/Dockerfile, target: runtime}
    command: [central-controller]
    environment:
      <<: *env
      DB_PATH: ${CENTRAL_DB_PATH:-/data/central.db}
    ports: ["${LAB_BIND_IP:-127.0.0.1}:${CENTRAL_PORT:-19088}:8088"]
    volumes:
      - ./.runtime/config.json:/config/config.json:ro
      - ./.runtime/identities/central:/run/lab-secrets:ro
      - central-data:/data
  zone-a:
    <<: *common
    command: [serveur-zone]
    environment:
      <<: *env
      ZONE_ID: ${ZONE_A_ID:-A}
      PLACEMENT_ENABLED: '1'
      APP_PORT: '8080'
      ZONE_DB_PATH: /data/zone.db
      LEDGER_PATH: /data/controller-ledger.json
    depends_on:
      central: {condition: service_healthy}
    volumes:
      - ./.runtime/config.json:/config/config.json:ro
      - ./.runtime/identities/zone-${ZONE_A_ID:-A}:/run/lab-secrets:ro
      - zone-a-data:/data
  zone-b:
    <<: *common
    command: [serveur-zone]
    environment:
      <<: *env
      ZONE_ID: ${ZONE_B_ID:-B}
      PLACEMENT_ENABLED: '1'
      APP_PORT: '8080'
      ZONE_DB_PATH: /data/zone.db
      LEDGER_PATH: /data/controller-ledger.json
    depends_on:
      central: {condition: service_healthy}
    volumes:
      - ./.runtime/config.json:/config/config.json:ro
      - ./.runtime/identities/zone-${ZONE_B_ID:-B}:/run/lab-secrets:ro
      - zone-b-data:/data
  edge-a:
    <<: *common
    command: [edge-bridge]
    environment:
      <<: *env
      EDGE_ID: ${EDGE_A_ID:-A1}
      EDGE_MODE: ${EDGE_MODE:-real-http}
      EDGE_BACKEND_URL: http://agent-a:8080
    depends_on:
      zone-a: {condition: service_healthy}
      zone-b: {condition: service_healthy}
    ports: ["${LAB_BIND_IP:-127.0.0.1}:${EDGE_A_PORT:-19081}:8088"]
    volumes:
      - ./.runtime/config.json:/config/config.json:ro
      - ./.runtime/identities/edge-${EDGE_A_ID:-A1}:/run/lab-secrets:ro
      - edge-a-ledger:/data
  edge-b:
    <<: *common
    command: [edge-bridge]
    environment:
      <<: *env
      EDGE_ID: ${EDGE_B_ID:-B1}
      EDGE_MODE: ${EDGE_MODE:-real-http}
      EDGE_BACKEND_URL: http://agent-b:8080
    depends_on:
      zone-a: {condition: service_healthy}
      zone-b: {condition: service_healthy}
    ports: ["${LAB_BIND_IP:-127.0.0.1}:${EDGE_B_PORT:-19082}:8088"]
    volumes:
      - ./.runtime/config.json:/config/config.json:ro
      - ./.runtime/identities/edge-${EDGE_B_ID:-B1}:/run/lab-secrets:ro
      - edge-b-ledger:/data
  agent-a:
    <<: *common
    command: [edge-agent]
    environment:
      EDGE_ID: ${EDGE_A_ID:-A1}
      EDGE_ZONE: ${ZONE_A_ID:-A}
      STORAGE_ROOT: /data
      HTTP_AUTH_TOKEN_FILE: /run/lab-secrets/edge-${EDGE_A_ID:-A1}.http-token
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:8080/health']
    volumes:
      - ./.runtime/identities/edge-${EDGE_A_ID:-A1}:/run/lab-secrets:ro
      - edge-a-files:/data
  agent-b:
    <<: *common
    command: [edge-agent]
    environment:
      EDGE_ID: ${EDGE_B_ID:-B1}
      EDGE_ZONE: ${ZONE_B_ID:-B}
      STORAGE_ROOT: /data
      HTTP_AUTH_TOKEN_FILE: /run/lab-secrets/edge-${EDGE_B_ID:-B1}.http-token
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:8080/health']
    volumes:
      - ./.runtime/identities/edge-${EDGE_B_ID:-B1}:/run/lab-secrets:ro
      - edge-b-files:/data
  auth:
    image: caribou/integration-auth:dev
    build: {context: ../.., dockerfile: deploy/integration/Dockerfile.auth}
    restart: unless-stopped
    volumes: ["auth-data:/data"]
    networks: [control]
  web:
    image: caribou/integration-web:dev
    build: {context: ../.., dockerfile: deploy/integration/Dockerfile.web}
    restart: unless-stopped
    init: true
    mem_limit: 1g
    cpus: 2.0
    environment:
      CENTRAL_URL: http://central:8088
      AUTH_URL: http://auth:8082
      UPLOAD_SOURCE_NODE: ${EDGE_A_ID:-A1}
    ports: ["${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-18090}:8080"]
    volumes:
      - ./.runtime/operator:/run/web-secrets:ro
      - ./.runtime/config.json:/config/config.json:ro
      - web-data:/data
    depends_on:
      central: {condition: service_healthy}
      auth: {condition: service_healthy}
      edge-a: {condition: service_healthy}
      edge-b: {condition: service_healthy}
      agent-a: {condition: service_healthy}
      agent-b: {condition: service_healthy}
    networks: [control]
networks:
  control: {driver: bridge}
volumes:
  broker-data:
  central-data:
  zone-a-data:
  zone-b-data:
  edge-a-ledger:
  edge-b-ledger:
  edge-a-files:
  edge-b-files:
  auth-data:
  web-data:
